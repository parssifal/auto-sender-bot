services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-sender-bot:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
      HEALTHCHECK_HOST: 0.0.0.0
      HEALTHCHECK_PORT: 8080
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
