<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои посты</title>
<style>
  :root{
    --bg:#eaeef6; --surface:#ffffff; --surface-2:#f4f6fb;
    --ink:#0d1220; --muted:#6b7488; --faint:#9aa3b5;
    --line:rgba(13,18,32,.08); --line-strong:rgba(13,18,32,.14);
    --accent:#4f7ffa; --jet-1:#4f7ffa; --jet-2:#22cdb0;
    --danger:#f2445f; --good:#12b39a; --ring-track:rgba(13,18,32,.09);
    --shadow:0 1px 2px rgba(13,18,32,.05), 0 8px 24px -12px rgba(20,40,90,.18);
    --radius:20px; --r-md:16px; --r-sm:12px; --pad:16px;
    --num:"SF Pro Rounded","ui-rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1320; --surface:#171f2e; --surface-2:#0f1826;
      --ink:#eaf0f8; --muted:#8a97ab; --faint:#5c6a80;
      --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
      --accent:#6ea0ff; --jet-1:#6ea0ff; --jet-2:#3fe0c4;
      --danger:#ff6076; --good:#2ad3b8; --ring-track:rgba(255,255,255,.10);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 55% at 85% -8%, color-mix(in srgb, var(--jet-2) 13%, transparent), transparent 60%),
      radial-gradient(120% 55% at 10% -5%, color-mix(in srgb, var(--jet-1) 15%, transparent), transparent 55%),
      var(--bg);
    background-attachment:fixed; color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
    padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
  }
  #app{max-width:600px; margin:0 auto; padding:0 var(--pad)}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 2px 14px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .glyph{width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); box-shadow:0 6px 16px -6px color-mix(in srgb,var(--jet-1) 60%, transparent)}
  .glyph svg{width:19px; height:19px}
  .brand h1{font-size:19px; font-weight:800; margin:0; letter-spacing:-.02em; line-height:1}
  .brand .sub{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:3px}
  .topbar-actions{display:flex; align-items:center; gap:9px; flex:none}
  .live{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 40%, transparent); border-radius:999px; padding:4px 8px}
  .adminlink{appearance:none; border:0; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:800;
    cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); white-space:nowrap}
  .adminlink:active{transform:scale(.94)}

  .banner{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 14px;
    font-size:12.5px; color:var(--muted); margin-bottom:16px; box-shadow:var(--shadow)}
  .eyebrow{font-size:11px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin:0 4px 12px}
  section{margin-bottom:24px}
  section[hidden]{display:none}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--pad); box-shadow:var(--shadow)}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:22px 0}

  /* Hero — next dispatch */
  .hero{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:24px; cursor:pointer}
  .hero::before{content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--jet-1) 55%,transparent), transparent 45%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}
  .hero-eyebrow{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:16px}
  .hero-eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--good); animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .hero-body{display:flex; align-items:center; gap:20px}
  .ring{--pct:20; position:relative; width:104px; height:104px; flex:none; border-radius:50%;
    background:radial-gradient(closest-side, var(--surface) 71%, transparent 72% 100%),
      conic-gradient(from -90deg, var(--jet-1), var(--jet-2) calc(var(--pct)*1%), var(--ring-track) 0);
    display:grid; place-items:center; transition:background .9s ease}
  .ring .rtime{font-family:var(--num); font-weight:800; font-size:26px; line-height:1; letter-spacing:-.02em}
  .ring .runit{font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:3px}
  .hero-info{min-width:0; flex:1}
  .hero-dest{font-size:17px; font-weight:800; letter-spacing:-.01em; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hero-when{font-family:var(--num); font-size:14px; font-weight:700; margin-bottom:10px}
  .hero-when .at{color:var(--muted); font-weight:600}
  .kindchip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
  .kindchip svg{width:13px; height:13px}

  .actions{display:flex; gap:9px; margin-top:16px}
  button.act{appearance:none; border:0; border-radius:var(--r-sm); padding:11px 15px; font-size:14px; font-weight:700;
    cursor:pointer; background:var(--surface-2); color:var(--ink); font-family:var(--sans); transition:transform .12s}
  button.act:active{transform:scale(.96)}
  button.act.primary{color:#fff; background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); flex:1}
  button.act.danger{color:var(--danger); background:transparent; border:1px solid color-mix(in srgb,var(--danger) 32%,transparent)}

  /* Timeline */
  .daygroup{margin-bottom:6px}
  .daylabel{font-size:12px; font-weight:800; color:var(--ink); margin:14px 4px 10px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
  .daylabel .rel{font-weight:600; color:var(--faint); font-size:11.5px}
  .tl{position:relative; padding-left:26px}
  .tl::before{content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--line-strong), var(--line))}
  .node{position:relative; margin-bottom:11px}
  .node::before{content:""; position:absolute; left:-26px; top:20px; transform:translateX(1.5px); width:11px; height:11px;
    border-radius:50%; background:var(--surface); border:2.5px solid var(--line-strong)}
  .node.soon::before{border-color:var(--jet-1); background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); box-shadow:0 0 0 4px color-mix(in srgb,var(--jet-1) 16%,transparent)}
  .item{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 15px; box-shadow:var(--shadow); cursor:pointer; transition:transform .14s}
  .item:active{transform:scale(.99)}
  .item-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .item-lead{display:flex; align-items:center; gap:10px; min-width:0}
  .item-ico{width:32px; height:32px; border-radius:9px; flex:none; display:grid; place-items:center; background:var(--surface-2); color:var(--muted)}
  .item-ico svg{width:16px; height:16px}
  .item-dest{font-size:15px; font-weight:700; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .item-time{font-family:var(--num); font-size:14px; font-weight:800; flex:none;
    color:transparent; background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); -webkit-background-clip:text; background-clip:text}
  .item-meta{font-size:12.5px; color:var(--muted); margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .item-actions{display:flex; gap:8px; margin-top:12px}
  button.tinybtn{appearance:none; border:0; border-radius:10px; padding:8px 13px; font-size:13px; font-weight:700; cursor:pointer;
    background:var(--surface-2); color:var(--ink); font-family:var(--sans); transition:transform .12s}
  button.tinybtn:active{transform:scale(.94)}
  button.tinybtn.danger{color:var(--danger)}

  /* Recurring */
  .recur{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 15px; box-shadow:var(--shadow); margin-bottom:10px}
  .recur-head{display:flex; align-items:center; gap:14px}
  .recur .tinybtn{margin-top:12px}
  .cadence{flex:none; width:50px; height:50px; border-radius:14px; display:grid; place-items:center; background:var(--surface-2)}
  .cadence svg{width:23px; height:23px; color:var(--accent)}
  .recur-info{flex:1; min-width:0}
  .recur-dest{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .recur-cad{display:inline-flex; align-items:center; font-family:var(--num); font-size:12.5px; font-weight:800; color:var(--ink);
    margin-top:5px; padding:3px 9px; border-radius:999px; background:color-mix(in srgb,var(--accent) 12%, transparent)}
  .recur-next{font-size:12px; color:var(--muted); margin-top:6px}

  .reveal{opacity:0; transform:translateY(9px); animation:rise .45s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1; transform:none}}

  /* Bottom-sheet modals (reschedule + preview) */
  .overlay{position:fixed; inset:0; background:rgba(6,10,20,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; z-index:20}
  .overlay.open{opacity:1; pointer-events:auto}
  .modal{background:var(--surface); border-radius:22px 22px 0 0; padding:8px 20px calc(22px + env(safe-area-inset-bottom));
    width:100%; max-width:600px; transform:translateY(103%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.5); max-height:88vh; overflow-y:auto}
  .overlay.open .modal{transform:none}
  .modal::before{content:""; display:block; width:38px; height:4px; border-radius:99px; background:var(--line-strong); margin:8px auto 16px}
  .modal h3{margin:0 0 14px; font-size:18px; font-weight:800; letter-spacing:-.01em}
  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:14px}
  .field label{font-size:12px; color:var(--muted); font-weight:700}
  .field input{appearance:none; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:12px; padding:12px 13px; font-size:16px; font-family:var(--num); font-weight:700}
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .modal .actions{justify-content:flex-end; margin-top:18px}
  .err{color:var(--danger); font-size:13px; min-height:18px; margin-bottom:8px}

  /* Compose */
  .fab{position:fixed; z-index:15; right:max(16px, calc(50% - 300px + 16px)); bottom:calc(18px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:19px; border:0; display:grid; place-items:center; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,var(--jet-1),var(--jet-2)); transition:transform .12s;
    box-shadow:0 12px 28px -10px color-mix(in srgb,var(--jet-1) 75%, transparent)}
  .fab svg{width:26px; height:26px}
  .fab:active{transform:scale(.92)}
  .fab[hidden]{display:none}
  .field select,.field textarea{appearance:none; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:12px; padding:12px 13px; font-size:16px; font-family:var(--sans); font-weight:600; width:100%}
  .field textarea{min-height:104px; resize:vertical; line-height:1.45}
  .field select:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
  .rx-cap{font-size:11px; color:var(--faint); font-weight:600}
  .rx-palette{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  button.rx-chip{appearance:none; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:999px; padding:6px 12px; font-size:19px; line-height:1; cursor:pointer}
  button.rx-chip:active{transform:scale(.94)}
  button.rx-chip.on{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 16%, transparent)}
  .rx-more{appearance:none; border:1px dashed var(--line-strong); background:transparent; color:var(--muted);
    border-radius:999px; padding:6px 13px; font-size:14px; font-weight:700; cursor:pointer}
  .rx-more:active{transform:scale(.94)}
  .rx-hint{font-size:11.5px; color:var(--faint); font-weight:600}
  #rx-picker{z-index:30}
  #rx-picker .modal{padding-left:14px; padding-right:14px}
  emoji-picker{width:100%; height:min(58vh,430px); --background:var(--surface); --border-color:var(--line-strong);
    --input-border-color:var(--line-strong); --input-font-color:var(--ink); --input-placeholder-color:var(--faint);
    --indicator-color:var(--accent); --emoji-size:1.5rem; --category-font-color:var(--muted)}
  .rx-presets{margin-top:12px; display:flex; flex-direction:column; gap:9px}
  .rx-preset-chips{display:flex; flex-wrap:wrap; gap:8px}
  .rx-preset{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line-strong); background:var(--surface-2);
    border-radius:999px; padding:5px 11px; font-size:14px; cursor:pointer}
  .rx-preset b{font-weight:700; color:var(--muted); font-size:12px}
  .rx-preset .x{color:var(--danger); font-weight:800; padding:0 2px}
  .rx-save{display:flex; gap:8px}
  .rx-save input{flex:1; appearance:none; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:10px; padding:8px 11px; font-size:13px}
  .rx-save input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .film.pick .frame{width:96px; aspect-ratio:1; border-radius:12px}
  .frame .pin{position:absolute; right:5px; top:5px; width:24px; height:24px; border-radius:8px; border:0; cursor:pointer;
    background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:1; display:grid; place-items:center}
  /* Drag handle. touch-action:none is what makes dragging it reorder instead of
     scrolling the strip — the tile itself keeps panning .film as usual. */
  .frame .pin.grip{top:auto; bottom:5px; right:auto; left:5px; width:22px; height:22px;
    font-size:12px; touch-action:none; cursor:grab}
  .frame .pin.grip:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .film.pick.dragging .pin.grip{cursor:grabbing}
  .frame.dragging{opacity:.5; outline:2px solid var(--accent); outline-offset:-2px}
  #c-add{margin-bottom:14px}
  #c-add[disabled]{opacity:.5}
  .check{display:flex; align-items:center; gap:9px; margin-bottom:14px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer}
  .check input{width:18px; height:18px; accent-color:var(--accent); flex:none}
  .check[hidden]{display:none}

  /* Post preview */
  .card[data-open]{cursor:pointer}
  .modal.wide{max-width:600px}
  .pv-when{font-family:var(--num); font-size:12px; color:var(--accent); font-weight:800; margin:-6px 0 14px}
  .film{display:flex; gap:9px; overflow-x:auto; margin:0 -20px 14px; padding:0 20px 6px; -webkit-overflow-scrolling:touch}
  .frame{position:relative; flex:none; width:170px; aspect-ratio:4/5; border-radius:14px; overflow:hidden; background:var(--surface-2); display:grid; place-items:center}
  /* Single photo drives its own box so portrait shots aren't letterboxed into
     a landscape frame — shrink-wrap the image, cap the height. */
  .frame.single{width:auto; max-width:100%; aspect-ratio:auto; background:none}
  .frame img{width:100%; height:100%; object-fit:contain; display:block}
  .frame.single img{width:auto; height:auto; max-width:100%; max-height:60vh}
  .frame .tico{width:36px; height:36px; color:var(--muted)}
  .frame .tlabel{position:absolute; left:8px; top:8px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:rgba(0,0,0,.5); border-radius:6px; padding:2px 6px}
  .frame .fname{position:absolute; left:8px; right:8px; bottom:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.5); border-radius:6px; padding:2px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pv-text{font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word}
  .pv-text.empty{color:var(--muted); font-style:italic}
  .pv-text a{color:var(--accent)}
  .pv-text code{font-family:ui-monospace,Menlo,monospace; font-size:.9em; background:var(--surface-2); padding:1px 4px; border-radius:5px}
  .pv-loading{color:var(--muted); font-size:13px; padding:12px 0}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .reveal{opacity:1; transform:none}
  }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2 15 22l-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></span>
      <div><h1 id="t-title">Мои посты</h1><div class="sub" id="t-sub">Очередь постов</div></div>
    </div>
    <div class="topbar-actions">
      <span class="live" id="t-demo" hidden>demo</span>
      <button class="adminlink" id="admin-link" hidden>Админ-панель</button>
    </div>
  </div>

  <div class="banner" id="tz-banner" hidden></div>

  <div id="hero-slot"></div>

  <section id="sec-queue">
    <p class="eyebrow" id="t-queue">Очередь отправки</p>
    <div id="queue-list"></div>
  </section>

  <section id="sec-recurring">
    <p class="eyebrow" id="t-recurring">По расписанию</p>
    <div id="recurring-list"></div>
  </section>
</div>

<button class="fab" id="fab" hidden aria-label="Новый пост">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="compose">
  <div class="modal">
    <h3 id="c-title">Новый пост</h3>
    <div class="err" id="c-err"></div>
    <div class="field">
      <label id="c-dest-l">Канал</label>
      <select id="c-dest"></select>
    </div>
    <div class="field">
      <label id="c-text-l">Текст</label>
      <textarea id="c-text"></textarea>
    </div>
    <div class="film pick" id="c-media" hidden></div>
    <button class="tinybtn" id="c-add">Добавить медиа</button>
    <input type="file" id="c-file" accept="image/*,video/*" multiple hidden>
    <label class="check" id="c-above-row" hidden>
      <input type="checkbox" id="c-above"><span id="c-above-l">Подпись над медиа</span>
    </label>
    <div class="field" id="c-rx-field" hidden>
      <label><span id="c-rx-l">Реакции-затравки</span> <span class="rx-cap" id="c-rx-cap"></span></label>
      <div class="rx-palette" id="c-rx-palette"></div>
      <div class="rx-presets" id="c-rx-presets" hidden>
        <label style="margin:0"><span id="c-rx-presets-l">Наборы</span></label>
        <div class="rx-hint" id="c-rx-presets-hint"></div>
        <div class="rx-preset-chips" id="c-rx-preset-chips"></div>
        <div class="rx-save">
          <input type="text" id="c-rx-name" maxlength="64" placeholder="Название набора">
          <button class="tinybtn" id="c-rx-save" type="button">Сохранить набор</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label id="c-date-l">Дата</label>
      <input type="date" id="c-date">
    </div>
    <div class="field">
      <label id="c-time-l">Время</label>
      <input type="time" id="c-time">
    </div>
    <div class="actions">
      <button class="act" id="c-cancel">Отмена</button>
      <button class="act primary" id="c-save">Запланировать</button>
    </div>
  </div>
</div>

<div class="overlay" id="rx-picker">
  <div class="modal">
    <h3 id="rxp-title">Эмодзи</h3>
    <div id="rxp-mount"></div>
  </div>
</div>

  <div class="modal">

function plural(n, forms){
  if(LANG==="ru"){
    const n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return forms[0];
    if(n10>=2 && n10<=4 && (n100<10 || n100>=20)) return forms[1];
    return forms[2];
  }
  return n===1 ? forms[0] : forms[1];
}

function pad(n){return String(n).padStart(2,"0");}
function fmtLocal(epoch){
  if(!epoch) return "—";
  return new Intl.DateTimeFormat(LANG==="ru"?"ru-RU":"en-GB",{
    timeZone:TZ, day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit",
  }).format(new Date(epoch*1000));
}
function timeOnly(epoch){
  return new Intl.DateTimeFormat(LANG==="ru"?"ru-RU":"en-GB",{ timeZone:TZ, hour:"2-digit", minute:"2-digit" }).format(new Date(epoch*1000));
}
// yyyy-mm-dd for an epoch as seen in the user's TZ, for day-bucketing.
function tzDateStr(epoch){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{
    timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",
  }).formatToParts(new Date(epoch*1000)).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function dayDiff(epoch){
  const nowDay = tzDateStr(Math.floor(Date.now()/1000));
  return Math.round((Date.parse(tzDateStr(epoch)+"T00:00:00Z") - Date.parse(nowDay+"T00:00:00Z"))/86400000);
}
function dayLabel(epoch){
  const d = dayDiff(epoch);
  if(d<=0) return { label:t("today"), rel:"" };
  if(d===1) return { label:t("tomorrow"), rel:"" };
  const label = new Intl.DateTimeFormat(LANG==="ru"?"ru-RU":"en-GB",{ timeZone:TZ, day:"numeric", month:"long" }).format(new Date(epoch*1000));
  return { label, rel:t("in_days")(d) };
}
// Countdown split; UTC-based remaining, so it is timezone-independent.
function relBig(sec){
  const s=Math.max(0,sec), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d>=1) return { n:d, u:plural(d, LANG==="ru"?["день","дня","дней"]:["day","days"]) };
  if(h>=1) return { n:h, u:plural(h, LANG==="ru"?["час","часа","часов"]:["hour","hours"]) };
  return { n:m, u:LANG==="ru"?"мин":"min" };
}
function relText(sec){
  const s=Math.max(0,sec), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  const b=relBig(s), prefix = LANG==="ru"?"через ":"in ";
  let sub="";
  if(d>=1) sub = ` ${h} ${LANG==="ru"?"ч":"h"}`;
  else if(h>=1) sub = ` ${m} ${LANG==="ru"?"мин":"min"}`;
  return prefix + b.n + " " + b.u + sub;
}

function localInputParts(epoch){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{
    timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hourCycle:"h23",
  }).formatToParts(new Date(epoch*1000)).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour}:${p.minute}` };
}
function composeLocal(dateStr,timeStr){ const [y,m,d]=dateStr.split("-"); return `${d}.${m}.${y} ${timeStr}`; }
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mediaContentType(f){
  if(f.type) return f.type;
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  return {
    jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", gif:"image/gif", webp:"image/webp",
    mp4:"video/mp4", m4v:"video/mp4", mov:"video/quicktime", webm:"video/webm",
  }[ext] || "application/octet-stream";
}

async function api(path,opts){
  // opts spreads first: otherwise its own `headers` key overwrites the merged
  // object and drops Authorization (→ 403 on any call that sets Content-Type).
  const r = await fetch(path,{ ...opts, headers:{...AUTH,...(opts?.headers||{})} });
  if(!r.ok){
    let msg = r.status;
    try{ const j = await r.json(); msg = j.error || msg; }catch{}
    throw new Error(msg);
  }
  return r.json();
}

function heroHtml(p){
  const kind = p.kind==="text"
    ? `<span class="kindchip">${IC_TEXT}${t("kind_text")}</span>`
    : `<span class="kindchip">${IC_MEDIA}${t("kind_media")(p.media_count)}</span>`;
  return `<div class="hero reveal" data-open="${p.id}" data-title="${escapeHtml(p.destination_title)}">
    <div class="hero-eyebrow"><span class="dot"></span>${t("hero_eyebrow")}</div>
    <div class="hero-body">
      <div class="ring" id="hero-ring"><div style="text-align:center">
        <div class="rtime" id="hero-big">—</div><div class="runit" id="hero-unit"></div>
      </div></div>
      <div class="hero-info">
        <p class="hero-dest">${escapeHtml(p.destination_title)}</p>
        <div class="hero-when" id="hero-rel"></div>
        ${kind}
      </div>
    </div>
    <div class="actions">
      <button class="act primary" data-act="resched" data-id="${p.id}" data-when="${p.scheduled_at_utc}">${t("resched")}</button>
      <button class="act" data-act="edit" data-id="${p.id}">${t("edit")}</button>
      <button class="act danger" data-act="cancel" data-id="${p.id}">${t("cancel")}</button>
    </div>
  </div>`;
}

function startCountdown(p){
  clearInterval(heroTimer);
  const tick = ()=>{
    const relEl = document.getElementById("hero-rel");
    const bigEl = document.getElementById("hero-big");
    const unitEl = document.getElementById("hero-unit");
    const ringEl = document.getElementById("hero-ring");
    if(!relEl) { clearInterval(heroTimer); return; }
    const sec = p.scheduled_at_utc - Math.floor(Date.now()/1000);
    const b = relBig(sec);
    bigEl.textContent = b.n; unitEl.textContent = b.u;
    relEl.innerHTML = `${relText(sec)} <span class="at">· ${timeOnly(p.scheduled_at_utc)}</span>`;
    // Ring fills as the send moment approaches within a 24h horizon.
    const pct = Math.max(4, Math.min(100, 100 - (sec/86400)*100));
    ringEl.style.setProperty("--pct", pct.toFixed(0));
  };
  tick();
  heroTimer = setInterval(tick, 1000);
}

function timelineItemHtml(p){
  const soon = (p.scheduled_at_utc - Math.floor(Date.now()/1000)) < 3*3600;
  const kind = p.kind==="text" ? t("kind_text") : t("kind_media")(p.media_count);
  return `<div class="node ${soon?"soon":""}">
    <div class="item" data-open="${p.id}" data-title="${escapeHtml(p.destination_title)}">
      <div class="item-top">
        <span class="item-lead"><span class="item-ico">${kindIcon(p.kind)}</span><span class="item-dest">${escapeHtml(p.destination_title)}</span></span>
        <span class="item-time">${timeOnly(p.scheduled_at_utc)}</span>
      </div>
      <div class="item-meta">${kind}${p.preview?" · "+escapeHtml(p.preview):""}</div>
      <div class="item-actions">
        <button class="tinybtn" data-act="resched" data-id="${p.id}" data-when="${p.scheduled_at_utc}">${t("resched")}</button>
        <button class="tinybtn" data-act="edit" data-id="${p.id}">${t("edit")}</button>
        <button class="tinybtn danger" data-act="cancel" data-id="${p.id}">${t("cancel")}</button>
      </div>
    </div>
  </div>`;
}

function renderQueue(posts, hasMore){
  const heroSlot = document.getElementById("hero-slot");
  const list = document.getElementById("queue-list");
  const sec = document.getElementById("sec-queue");
  clearInterval(heroTimer);
  if(!posts.length){
    heroSlot.innerHTML = `<div class="card"><div class="empty">${t("empty_q")}</div></div>`;
    sec.hidden = true;
    return;
  }
  const [head, ...rest] = posts;
  heroSlot.innerHTML = heroHtml(head);
  startCountdown(head);

  if(!rest.length && !hasMore){ sec.hidden = true; return; }
  sec.hidden = false;
  // Group the remaining posts by their dispatch day (chronological order is
  // real information: it is the order they fly).
  const groups = [];
  for(const p of rest){
    const dl = dayLabel(p.scheduled_at_utc);
    let g = groups.find(x=>x.label===dl.label);
    if(!g){ g = { label:dl.label, rel:dl.rel, items:[] }; groups.push(g); }
    g.items.push(p);
  }
  let html = "";
  for(const g of groups){
    html += `<div class="daygroup"><div class="daylabel">${escapeHtml(g.label)}${g.rel?`<span class="rel">${escapeHtml(g.rel)}</span>`:""}</div><div class="tl">`;
    for(const p of g.items) html += timelineItemHtml(p);
    html += `</div></div>`;
  }
  if(hasMore) html += `<div class="empty">${t("truncated")}</div>`;
  list.innerHTML = html;
}

function renderRecurring(patterns){
  const el = document.getElementById("recurring-list");
  const sec = document.getElementById("sec-recurring");
  if(!patterns.length){ sec.hidden = false; el.innerHTML = `<div class="card"><div class="empty">${t("empty_r")}</div></div>`; return; }
  sec.hidden = false;
  el.innerHTML = "";
  for(const p of patterns){
    const tod = pad(Math.floor(p.time_of_day_minutes/60))+":"+pad(p.time_of_day_minutes%60);
    const card = document.createElement("div"); card.className="recur";
    card.innerHTML = `
      <div class="recur-head">
        <div class="cadence">${cadenceIcon(p.interval_type)}</div>
        <div class="recur-info">
          <div class="recur-dest">${escapeHtml(p.destination_title)}</div>
          <span class="recur-cad">${intervalLabel(p.interval_type)} · ${tod}</span>
          <div class="recur-next">${t("next")} — ${fmtLocal(p.next_scheduled_at_utc)}</div>
        </div>
      </div>
      <button class="tinybtn danger" data-act="rec-cancel" data-id="${p.id}">${t("cancel_series")}</button>`;
    el.appendChild(card);
  }
}

async function loadAll(){
  if(!initData){ renderDemo(); return; }
  const [q, rec] = await Promise.all([api("/api/my/queue"), api("/api/my/recurring")]);
  TZ = q.tz || TZ; LANG = q.lang || LANG;
  applyStaticLabels();
  if(q.is_admin){ document.getElementById("admin-link").hidden = false; }
  document.getElementById("fab").hidden = false;
  renderQueue(q.posts, q.has_more);
  renderRecurring(rec.patterns);
}

const modal = document.getElementById("modal");
function openModal(id, epoch){
  rescheduleId = id;
  // Always reset the fields to the post's own time: the inputs otherwise keep
  // whatever was typed for a previously rescheduled post.
  const cur = localInputParts(Number(epoch) || Math.floor(Date.now()/1000));
  document.getElementById("m-date").value = cur.date;
  document.getElementById("m-time").value = cur.time;

function closeModal(){ modal.classList.remove("open"); rescheduleId = null; }
document.getElementById("m-cancel").addEventListener("click", closeModal);
modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });
document.getElementById("m-save").addEventListener("click", async ()=>{

// Compose — writes a one-off post, new or existing
const compose = document.getElementById("compose");
const cErr = document.getElementById("c-err");
// [{type, url, file_id?, keep?}] — a freshly uploaded item carries a file_id,
// one already on the post carries its index instead, so Telegram file_ids never
// reach the browser. url is a local preview only.
let composeMedia = [];
let composeEditId = null;   // null = new post
let composeRequestId = null;
let rxMeta = null;          // {plan,cap,palette,any_emoji,presets_allowed,presets}
let rxSelected = [];        // ordered seed emojis, capped at rxMeta.cap
// Recently-picked custom emoji (premium), kept client-side so an "any emoji"
// choice is one tap next time instead of reopening the picker.
let rxRecent = (()=>{ try{ return JSON.parse(localStorage.getItem("rx_recent")||"[]").filter(x=>typeof x==="string").slice(0,12); }catch{ return []; } })();
function rxPushRecent(e){
  rxRecent = [e, ...rxRecent.filter(x=>x!==e)].slice(0,12);
  try{ localStorage.setItem("rx_recent", JSON.stringify(rxRecent)); }catch{}
}

// The palette shown is the plan's quick set, plus recent custom picks and any
// already-selected emoji (so a premium custom pick renders as a toggleable chip).
function renderReactions(){
  const field = document.getElementById("c-rx-field");
  if(!rxMeta){ field.hidden = true; return; }
  field.hidden = false;
  document.getElementById("c-rx-cap").textContent = t("rx_cap")(rxMeta.cap);
  const pal = [...rxMeta.palette];
  if(rxMeta.any_emoji) for(const e of rxRecent) if(!pal.includes(e)) pal.push(e);
  for(const e of rxSelected) if(!pal.includes(e)) pal.push(e);
  document.getElementById("c-rx-palette").innerHTML =
    pal.map(e=>`<button type="button" class="rx-chip${rxSelected.includes(e)?" on":""}" data-rx="${escapeHtml(e)}">${escapeHtml(e)}</button>`).join("")
    + (rxMeta.any_emoji ? `<button type="button" class="rx-more" id="c-rx-more">${t("rx_add_emoji")}</button>` : "");
  const pres = document.getElementById("c-rx-presets");
  pres.hidden = !rxMeta.presets_allowed;
  if(rxMeta.presets_allowed){
    document.getElementById("c-rx-preset-chips").innerHTML = rxMeta.presets.map(p=>
      `<span class="rx-preset" data-preset="${escapeHtml(p.post_type)}">${escapeHtml(p.emojis.join(""))} <b>${escapeHtml(p.post_type)}</b> <span class="x" data-del="${escapeHtml(p.post_type)}">×</span></span>`).join("");
  }
}
function rxAdd(e){
  if(rxSelected.includes(e)) return;
  if(rxSelected.length >= rxMeta.cap) rxSelected.shift();   // FIFO drop over cap
  rxSelected.push(e);
}
function toggleEmoji(e){
  const i = rxSelected.indexOf(e);
  if(i >= 0) rxSelected.splice(i,1); else rxAdd(e);
  renderReactions();
}
function loadPreset(name){
  const p = rxMeta.presets.find(x=>x.post_type===name);
  if(!p) return;
  rxSelected = p.emojis.slice(0, rxMeta.cap);
  renderReactions();
}
async function deletePreset(name){
  try{ await api(`/api/my/reactions/preset/${encodeURIComponent(name)}/delete`,{method:"POST"}); }
  catch(e){ cErr.textContent = errText(e.message); return; }
  rxMeta.presets = rxMeta.presets.filter(p=>p.post_type!==name);
  renderReactions();
}
async function savePreset(){
  const name = (document.getElementById("c-rx-name").value||"").trim();
  if(!name){ cErr.textContent = t("rx_need_name"); return; }
  if(!rxSelected.length){ cErr.textContent = t("rx_need_emoji"); return; }
  try{
    const r = await api("/api/my/reactions/preset",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ post_type:name, emojis:rxSelected }),
    });
    const ex = rxMeta.presets.find(p=>p.post_type===name);
    if(ex) ex.emojis = r.emojis; else rxMeta.presets.push({post_type:name, emojis:r.emojis});
    document.getElementById("c-rx-name").value = "";
    renderReactions();
  }catch(e){ cErr.textContent = errText(e.message); }
}
document.getElementById("c-rx-field").addEventListener("click",(e)=>{
  const del = e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); deletePreset(del.dataset.del); return; }
  const chip = e.target.closest("[data-rx]");
  if(chip){ toggleEmoji(chip.dataset.rx); return; }
  const pre = e.target.closest("[data-preset]");
  if(pre){ loadPreset(pre.dataset.preset); return; }
  if(e.target.id === "c-rx-more"){ openRxPicker(); }
});
document.getElementById("c-rx-save").addEventListener("click", savePreset);

// Emoji picker (premium "any emoji"): vendored emoji-picker-element, loaded on
// first open. dataSource is pinned to our origin (CSP blocks the CDN default).
const rxPickerOverlay = document.getElementById("rx-picker");
let rxPickerEl = null;
async function openRxPicker(){
  if(!rxPickerEl){
    try{
      const { Picker } = await import("/app/vendor/emoji/index.js");
      rxPickerEl = new Picker({ dataSource: "/app/vendor/emoji/data.json" });
      rxPickerEl.addEventListener("emoji-click", (ev)=>{
        const u = ev.detail && ev.detail.unicode;
        if(!u) return;
        rxAdd(u); rxPushRecent(u); renderReactions();
      });
      document.getElementById("rxp-mount").appendChild(rxPickerEl);
    }catch(err){ cErr.textContent = t("rx_picker_fail"); return; }
  }
  rxPickerOverlay.classList.add("open");
}
// Backdrop tap closes; taps inside the sheet don't bubble out to it.
rxPickerOverlay.addEventListener("click", (e)=>{ if(e.target === rxPickerOverlay) rxPickerOverlay.classList.remove("open"); });

function newRequestId(){
  if(window.crypto?.randomUUID) return window.crypto.randomUUID();
  return String(Date.now()) + "-" + Math.random();
}

function releaseComposeMedia(){
  for(const m of composeMedia) if(m.url) URL.revokeObjectURL(m.url);
  composeMedia = [];
}
// A post edited here can carry media the bot flow accepts but this sheet cannot
// upload (documents, audio) — they are shown as-is and kept on save.
function composeTile(m){
  if(m.type === "photo") return `<img${m.url?` src="${m.url}"`:""}>`;
  const isVideo = m.type === "video" || m.type === "animation";
  return `<span class="tlabel">${isVideo ? t("kind_video") : t("kind_doc")}</span>`
    + `<svg class="tico" viewBox="0 0 24 24" fill="none">${isVideo ? SVG_VIDEO : SVG_DOC}</svg>`;
}
function renderComposeMedia(){
  const el = document.getElementById("c-media");
  el.innerHTML = composeMedia.map((m,i)=>`<div class="frame">${
    composeTile(m)
  }<button class="pin" data-rm="${i}" aria-label="${t("c_remove")}">✕</button>${
    composeMedia.length > 1
      ? `<button class="pin grip" data-grip="${i}" aria-label="${t("c_reorder")}">⠿</button>`
      : ""
  }</div>`).join("");
  el.hidden = !composeMedia.length;
  document.getElementById("c-above-row").hidden = !composeMedia.length;
}

// Reorder is insert-at-position, not swap: dragging item 0 to the end must
// shift the rest left, not trade places with whatever sits there.
function moveComposeMedia(from, to){
  if(to < 0 || to >= composeMedia.length || from === to) return false;
  composeMedia.splice(to, 0, ...composeMedia.splice(from, 1));
  return true;
}

async function openCompose(postId){
  composeEditId = postId || null;
  composeRequestId = composeEditId ? null : newRequestId();
  releaseComposeMedia(); renderComposeMedia();
  cErr.textContent = "";
  document.getElementById("c-title").textContent = t(composeEditId ? "c_edit" : "c_new");
  document.getElementById("c-save").textContent = t(composeEditId ? "c_update" : "c_save");
  document.getElementById("c-text").value = "";
  document.getElementById("c-above").checked = false;
  const start = localInputParts(Math.floor(Date.now()/1000) + 3600);
  document.getElementById("c-date").value = start.date;
  document.getElementById("c-time").value = start.time;
  rxSelected = []; rxMeta = null; renderReactions();
  const sel = document.getElementById("c-dest");
  sel.innerHTML = `<option value="">${t("c_loading")}</option>`;
  compose.classList.add("open");
  api("/api/my/reactions").then(m=>{ rxMeta = m; renderReactions(); }).catch(()=>{});
  try{
    const d = await api("/api/my/destinations");
    sel.innerHTML = d.destinations.length
      ? d.destinations.map(x=>`<option value="${x.chat_id}"${x.can_post?"":" disabled"}>${
          escapeHtml(x.title)}${x.can_post?"":" — "+t("c_no_rights")}</option>`).join("")
      : `<option value="">${t("c_no_dest")}</option>`;
  }catch(e){ sel.innerHTML = ""; cErr.textContent = errText(e.message); return; }
  if(composeEditId) await prefillCompose(composeEditId);
}

// Load an existing post into the sheet. Runs after the destination list so the
// post's own channel can be preselected.
async function prefillCompose(id){
  let d;
  try{ d = await api(`/api/my/post/${id}`); }
  catch(e){ cErr.textContent = errText(e.message); return; }
  if(composeEditId !== id) return;   // sheet was closed or reused while loading
  const sel = document.getElementById("c-dest");
  // A channel the bot lost rights to is rendered disabled; still select it, so
  // the user sees which one the post targets rather than a silent wrong pick.
  if([...sel.options].some(o=>o.value === String(d.chat_id))) sel.value = String(d.chat_id);
  document.getElementById("c-text").value = (d.kind === "media" ? d.caption : d.text) || "";
  document.getElementById("c-above").checked = !!d.caption_above;
  const when = localInputParts(d.scheduled_at_utc);
  document.getElementById("c-date").value = when.date;
  document.getElementById("c-time").value = when.time;
  composeMedia = (d.media || []).map(m=>({ type:m.type, keep:m.idx, url:null }));
  renderComposeMedia();
  rxSelected = Array.isArray(d.reactions) ? d.reactions.slice() : [];
  renderReactions();
  for(const m of composeMedia) if(m.type === "photo") loadComposeThumb(id, m);
}

// Thumbnails for media already on the post come through the same authorised
// media proxy the preview sheet uses.
async function loadComposeThumb(postId, m){
  try{
    const r = await fetch(`/api/my/post/${postId}/media/${m.keep}`, { headers: AUTH });
    if(!r.ok) throw new Error(r.status);
    const url = URL.createObjectURL(await r.blob());
    if(!composeMedia.includes(m)){ URL.revokeObjectURL(url); return; }
    m.url = url;
    // A re-render mid-drag would break the gesture; the drag ends with one anyway.
    if(dragFrom === null) renderComposeMedia();
  }catch{ /* the tile stays blank; the item is still kept on save */ }
}

function closeCompose(){
  compose.classList.remove("open");
  composeEditId = null;
  composeRequestId = null;
  endComposeDrag();
  releaseComposeMedia();
}

document.getElementById("fab").addEventListener("click", ()=> openCompose());
document.getElementById("c-cancel").addEventListener("click", closeCompose);
compose.addEventListener("click", (e)=>{ if(e.target === compose) closeCompose(); });
document.getElementById("c-add").addEventListener("click", ()=> document.getElementById("c-file").click());

// Each file is relayed to Telegram by the server, which hands back a file_id;
// the browser can never produce one itself.
document.getElementById("c-file").addEventListener("change", async (e)=>{
  const files = [...e.target.files];
  e.target.value = "";
  const addBtn = document.getElementById("c-add");
  addBtn.disabled = true;
  for(const f of files){
    if(composeMedia.length >= 10){ cErr.textContent = t("c_max_media"); break; }
    cErr.textContent = t("c_uploading");
    const contentType = mediaContentType(f);
    try{
      const r = await api("/api/my/media", {
        method:"POST",
        headers:{"Content-Type": contentType},
        body: f,
      });
      composeMedia.push({
        type: r.type, file_id: r.file_id,
        url: contentType.startsWith("image/") ? URL.createObjectURL(f) : null,
      });
      cErr.textContent = "";
      renderComposeMedia();
    }catch(ex){ cErr.textContent = errText(ex.message); break; }
  }
  addBtn.disabled = false;
});

const cMedia = document.getElementById("c-media");

cMedia.addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-rm]");
  if(!btn) return;
  const [removed] = composeMedia.splice(Number(btn.dataset.rm), 1);
  if(removed?.url) URL.revokeObjectURL(removed.url);
  renderComposeMedia();
});

// Reordering by dragging the grip. HTML5 drag-and-drop is mouse-only by spec, so
// pointer events carry both finger and mouse through one path.
let dragFrom = null;

cMedia.addEventListener("pointerdown", (e)=>{
  const grip = e.target.closest("button[data-grip]");
  if(!grip) return;
  dragFrom = Number(grip.dataset.grip);
  // Capture on the grip: the finger will leave this tile, and without capture
  // the move events would go to whatever is underneath instead.
  grip.setPointerCapture(e.pointerId);
  cMedia.children[dragFrom]?.classList.add("dragging");
  cMedia.classList.add("dragging");
  tg?.HapticFeedback?.impactOccurred?.("light");
  e.preventDefault();   // no text selection / native image drag
  grip.focus();         // preventDefault suppresses the implicit focus
});

cMedia.addEventListener("pointermove", (e)=>{
  if(dragFrom === null) return;
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest(".frame");
  if(!over || over.parentElement !== cMedia) return;
  const to = [...cMedia.children].indexOf(over);
  if(to < 0 || !moveComposeMedia(dragFrom, to)) return;
  // Move the node instead of re-rendering: a re-render would destroy the element
  // holding the pointer capture and the gesture would die halfway.
  cMedia.insertBefore(cMedia.children[dragFrom], to > dragFrom ? over.nextSibling : over);
  dragFrom = to;
});

function endComposeDrag(){
  if(dragFrom === null) return;
  dragFrom = null;
  cMedia.classList.remove("dragging");
  renderComposeMedia();   // resync data-rm / data-grip with the new order
}
// lostpointercapture is the one signal for every way a gesture can end — release,
// cancel, or the element going away mid-drag. Without it an interrupted drag would
// leave dragFrom set, which silently stops thumbnails from rendering.
cMedia.addEventListener("lostpointercapture", endComposeDrag);
cMedia.addEventListener("pointerup", endComposeDrag);   // capture never established

// The grip doubles as the keyboard control — dragging is pointer-only, and
// arrow keys on the focused grip are the accessible path to the same reorder.
cMedia.addEventListener("keydown", (e)=>{
  const grip = e.target.closest("button[data-grip]");
  if(!grip) return;
  const dir = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
  if(!dir) return;
  e.preventDefault();
  const to = Number(grip.dataset.grip) + dir;
  if(!moveComposeMedia(Number(grip.dataset.grip), to)) return;
  renderComposeMedia();
  cMedia.querySelector(`button[data-grip="${to}"]`)?.focus();
});

document.getElementById("c-save").addEventListener("click", async ()=>{
  const chatId = document.getElementById("c-dest").value;

});

// Post preview
const detail = document.getElementById("detail");
let objectUrls = [];
let detailId = null;
function safeUrl(u){ return /^(https?:|tg:)/i.test(u||"") ? u : "#"; }
function entityTag(e){
  switch(e.type){
    case "bold": return ["<b>","</b>"];
    case "italic": return ["<i>","</i>"];
    case "underline": return ["<u>","</u>"];
    case "strikethrough": return ["<s>","</s>"];
    case "code": case "pre": return ["<code>","</code>"];
    case "blockquote": return ["<blockquote>","</blockquote>"];
    case "text_link": return e.url ? [`<a href="${escapeHtml(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">`,"</a>"] : null;
    default: return null;
  }
}
// ponytail: boundary insertion; relies on Telegram's properly-nested entities.
// Iterating by UTF-16 index keeps surrogate-pair emoji intact on rejoin.
function renderEntities(text, entities){
  if(!text) return "";
  if(!entities || !entities.length) return escapeHtml(text);
  const opens = {}, closes = {};
  for(const e of entities){
    const tag = entityTag(e); if(!tag) continue;
    (opens[e.offset] = opens[e.offset] || []).push(tag[0]);
    (closes[e.offset + e.length] = closes[e.offset + e.length] || []).unshift(tag[1]);
  }
  let out = "";
  for(let i=0;i<=text.length;i++){
    if(closes[i]) out += closes[i].join("");
    if(i<text.length){
      if(opens[i]) out += opens[i].join("");
      out += escapeHtml(text[i]);
    }
  }
  return out;
}
const SVG_VIDEO = '<path d="M8 5v14l11-7z" fill="currentColor"/>';
const SVG_DOC = '<path d="M14 3v5h5M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
function frameTile(icon, label){
  return `<div class="frame"><span class="tlabel">${escapeHtml(label)}</span><svg class="tico" viewBox="0 0 24 24" fill="none">${icon}</svg></div>`;
}
async function loadPhoto(img, postId, idx){
  try{
    const r = await fetch(`/api/my/post/${postId}/media/${idx}`, { headers: AUTH });
    if(!r.ok) throw new Error(r.status);
    const url = URL.createObjectURL(await r.blob());
    objectUrls.push(url);
    img.src = url;
  }catch{ img.parentElement.textContent = "—"; }
}
async function openDetail(id, title){
  detailId = id;
  document.getElementById("pv-title").textContent = title || "";
  document.getElementById("pv-when").textContent = "";
  const mediaEl = document.getElementById("pv-media");
  const textEl = document.getElementById("pv-text");
  mediaEl.innerHTML = "";
  textEl.className = "pv-text"; textEl.innerHTML = `<div class="pv-loading">${t("loading")}</div>`;
  detail.classList.add("open");
  let d;
  try{ d = await api(`/api/my/post/${id}`); }
  catch(e){ textEl.innerHTML = `<div class="pv-loading">${t("err")(e.message)}</div>`; return; }
  document.getElementById("pv-when").textContent = fmtLocal(d.scheduled_at_utc);
  if(d.media && d.media.length){
    const single = d.media.length === 1;
    const film = document.createElement("div"); film.className = "film";
    for(const m of d.media){
      if(m.type === "photo"){
        const f = document.createElement("div"); f.className = "frame" + (single?" single":"");
        const img = document.createElement("img"); f.appendChild(img); film.appendChild(f);
        loadPhoto(img, id, m.idx);
      }else if(m.type === "video" || m.type === "animation"){
        film.insertAdjacentHTML("beforeend", frameTile(SVG_VIDEO, t("kind_video")));
      }else{
        film.insertAdjacentHTML("beforeend", frameTile(SVG_DOC, t("kind_doc")));
      }
    }
    mediaEl.appendChild(film);
  }
  const body = d.kind === "media" ? d.caption : d.text;
  const ents = d.kind === "media" ? d.caption_entities : d.entities;
  if(body){ textEl.innerHTML = renderEntities(body, ents); }
  else { textEl.className = "pv-text empty"; textEl.textContent = t("no_caption"); }
}
function closeDetail(){
  detail.classList.remove("open");
  detailId = null;
  for(const u of objectUrls) URL.revokeObjectURL(u);
  objectUrls = [];
}
document.getElementById("pv-close").addEventListener("click", closeDetail);
document.getElementById("pv-edit").addEventListener("click", ()=>{
  const id = detailId;
  closeDetail();
  if(id) openCompose(id);
});
detail.addEventListener("click", (e)=>{ if(e.target === detail) closeDetail(); });

document.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button[data-act]");
  if(!btn){
    const card = e.target.closest("[data-open]");
    if(card) openDetail(card.dataset.open, card.dataset.title);
    return;
  }
  const id = btn.dataset.id, act = btn.dataset.act;
  try{
    if(act==="resched"){ openModal(id, btn.dataset.when); return; }
    if(act==="edit"){ openCompose(id); return; }
    if(act==="cancel"){
      if(!confirm(t("confirm_cancel"))) return;
      await api(`/api/my/post/${id}/cancel`, { method:"POST" });
    }else if(act==="rec-cancel"){
      if(!confirm(t("confirm_series"))) return;
      await api(`/api/my/recurring/${id}/cancel`, { method:"POST" });
    }
    await loadAll();
  }catch(err){ alert(t("err")(err.message)); }
});
